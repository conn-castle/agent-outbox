name: Release Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate production source ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"

  prepare-release:
    name: Resolve numbered release
    needs: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Resolve release metadata
        id: release
        run: node scripts/production-release.mjs prepare

  certify:
    name: Certify exact release SHA
    needs: validate-ref
    permissions:
      contents: read
    uses: ./.github/workflows/release-check.yml

  deploy:
    name: Deploy and verify production Worker
    needs: [prepare-release, certify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Capture healthy rollback target
        id: rollback-target
        env:
          APP_BASE_URL: https://app.agent-outbox.dev
          CLOUDFLARE_API_TOKEN:
            ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_API_TOKEN }}
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
        run: node scripts/production-release.mjs capture-rollback

      - name: Verify rollback target before deploy
        env:
          AGENT_OUTBOX_EXPECTED_RELEASE:
            ${{ steps.rollback-target.outputs.rollback_release }}
          AGENT_OUTBOX_RUNTIME_SMOKE_USE_PROCESS_ENV: "1"
          APP_BASE_URL: https://app.agent-outbox.dev
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
        run: corepack pnpm run smoke-runtime

      - name: Require production migration credential
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          if [[ -z "${DATABASE_MIGRATION_URL:-}" ]]; then
            echo "DATABASE_MIGRATION_URL is required in the production GitHub environment secrets." >&2
            exit 1
          fi

      - name: Validate production migration history before apply
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: corepack pnpm run migration:validate-pre-migrate

      - name: Apply production database migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: corepack pnpm run migration:migrate

      - name: Validate production migration history after apply
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: corepack pnpm run migration:validate

      - name: Mark deployment attempt
        id: deploy-attempt
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        env:
          AGENT_OUTBOX_RELEASE_TAG:
            ${{ needs.prepare-release.outputs.release_tag }}
          APP_ENV: production
          APP_BASE_URL: https://app.agent-outbox.dev
          PUBLIC_APP_BASE_URL: https://app.agent-outbox.dev
          SENTRY_RELEASE: ${{ github.sha }}
          AGENT_OUTBOX_SENTRY_RELEASE_UPLOAD: "1"
          AGENT_OUTBOX_SENTRY_DEPLOY_RELEASE_PATH: "1"
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          SENTRY_BROWSER_DSN: ${{ vars.SENTRY_BROWSER_DSN }}
          STRIPE_PAID_MONTHLY_PRICE_ID: ${{ vars.STRIPE_PAID_MONTHLY_PRICE_ID }}
          STRIPE_PAID_YEARLY_PRICE_ID: ${{ vars.STRIPE_PAID_YEARLY_PRICE_ID }}
          STRIPE_BILLING_PORTAL_CONFIGURATION_ID:
            ${{ vars.STRIPE_BILLING_PORTAL_CONFIGURATION_ID }}
          NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN:
            ${{ vars.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          CLOUDFLARE_API_TOKEN:
            ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CALLER_KEY_HASH_SECRET: ${{ secrets.CALLER_KEY_HASH_SECRET }}
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: corepack pnpm run worker:deploy

      - name: Verify deployed release
        env:
          AGENT_OUTBOX_EXPECTED_RELEASE: ${{ github.sha }}
          AGENT_OUTBOX_RUNTIME_SMOKE_USE_PROCESS_ENV: "1"
          APP_BASE_URL: https://app.agent-outbox.dev
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
        run: corepack pnpm run smoke-runtime

      # Automatic rollback runs inside this already-approved deploy job so it can
      # never be gated behind a second production-environment approval. It fires
      # only when a deploy was attempted and a later step failed; the earlier
      # failure keeps the job red.
      - name: Roll back on failed deploy
        id: rollback-worker
        if: failure() && steps.deploy-attempt.outputs.attempted == 'true'
        env:
          CLOUDFLARE_API_TOKEN:
            ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_API_TOKEN }}
          ROLLBACK_VERSION_ID:
            ${{ steps.rollback-target.outputs.rollback_version_id }}
        run: >-
          corepack pnpm exec wrangler rollback "$ROLLBACK_VERSION_ID" --name
          agent-outbox --message "Automatic rollback after failed ${{
          needs.prepare-release.outputs.release_tag }} deploy" --yes --env-file
          /dev/null

      - name: Verify restored release
        if: failure() && steps.deploy-attempt.outputs.attempted == 'true'
        env:
          AGENT_OUTBOX_EXPECTED_RELEASE:
            ${{ steps.rollback-target.outputs.rollback_release }}
          AGENT_OUTBOX_RUNTIME_SMOKE_USE_PROCESS_ENV: "1"
          APP_BASE_URL: https://app.agent-outbox.dev
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
        run: corepack pnpm run smoke-runtime

  finalize-release:
    name: Tag verified production release
    needs: [prepare-release, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Create numbered GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node scripts/production-release.mjs finalize

name: Release Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate production source ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"

  prepare-release:
    name: Resolve numbered release
    needs: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Resolve release metadata
        id: release
        run: node scripts/production-release.mjs prepare

  certify:
    name: Certify exact release SHA
    needs: validate-ref
    permissions:
      contents: read
    uses: ./.github/workflows/release-check.yml

  build-cli:
    name: Build and validate release CLI
    needs: [prepare-release, certify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Ensure exact local release tag
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Release tag ${RELEASE_TAG} points to ${tag_sha}, not candidate ${GITHUB_SHA}."
              exit 1
            fi
          else
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          fi

      - name: Build tagged CLI release artifacts
        run: make cli-release-dist RELEASE_TAG="${RELEASE_TAG}"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # main as of 2026-08-21
        with:
          token: ${{ github.token }}

      - name: Validate generated Homebrew cask
        run: |
          ruby -c dist/homebrew/Casks/agent-outbox.rb
          brew style dist/homebrew/Casks/agent-outbox.rb

      - name: Upload certified CLI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-outbox-release-${{ github.sha }}
          overwrite: true
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/homebrew/Casks/agent-outbox.rb
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish verified production release
    needs: [prepare-release, certify, build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Download certified CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-outbox-release-${{ github.sha }}
          path: dist

      - name: Require public release repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          if [[ "$visibility" != "public" ]]; then
            echo "::error::The release repository must be public before production deployment."
            exit 1
          fi

      - name: Prepare exact-candidate GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node scripts/production-release.mjs prepare-draft

      - name: Upload certified CLI assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          existing_dir="$(mktemp -d)"
          trap 'rm -rf "$existing_dir"' EXIT
          for artifact in dist/*.tar.gz dist/checksums.txt; do
            asset="$(basename "$artifact")"
            if grep -Fqx -- "$asset" <<<"$existing_assets"; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$existing_dir"
              if ! cmp -s "$artifact" "$existing_dir/$asset"; then
                echo "::error::Existing CLI release asset differs from the certified build: $asset"
                echo "::error::Refusing to delete or replace a release asset."
                exit 1
              fi
              echo "Retaining identical existing CLI release asset: $asset"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$artifact"
          done

      - name: Verify complete draft asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          expected_assets="$(for artifact in dist/*.tar.gz dist/checksums.txt; do basename "$artifact"; done | LC_ALL=C sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "::error::Draft release asset inventory differs from the certified build."
            exit 1
          fi
          for artifact in dist/*.tar.gz dist/checksums.txt; do
            asset="$(basename "$artifact")"
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$download_dir"
            if ! cmp -s "$artifact" "$download_dir/$asset"; then
              echo "::error::Draft release asset differs from the certified build: $asset"
              exit 1
            fi
          done

      - name: Create Homebrew preflight token
        id: tap-preflight-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}
          owner: conn-castle
          repositories: homebrew-tap

      - name: Verify Homebrew tap access
        env:
          GH_TOKEN: ${{ steps.tap-preflight-token.outputs.token }}
        run:
          test "$(gh api repos/conn-castle/homebrew-tap --jq '.name')" =
          "homebrew-tap"

      - name: Capture healthy rollback target
        id: rollback-target
        env:
          APP_BASE_URL: https://app.agent-outbox.dev
          CLOUDFLARE_API_TOKEN:
            ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_API_TOKEN }}
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
        run: node scripts/production-release.mjs capture-rollback

      - name: Verify rollback target before deploy
        env:
          AGENT_OUTBOX_EXPECTED_RELEASE:
            ${{ steps.rollback-target.outputs.rollback_release }}
          AGENT_OUTBOX_RUNTIME_SMOKE_USE_PROCESS_ENV: "1"
          APP_BASE_URL: https://app.agent-outbox.dev
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
        run: corepack pnpm run smoke-runtime

      - name: Require production migration credential
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          if [[ -z "${DATABASE_MIGRATION_URL:-}" ]]; then
            echo "DATABASE_MIGRATION_URL is required in the production GitHub environment secrets." >&2
            exit 1
          fi
          # Flyway prints its own connection banner, which would expose the
          # production database host in public workflow logs. Register the host
          # as a log mask here; masks persist for the remainder of the job.
          host="${DATABASE_MIGRATION_URL#*://}"
          host="${host##*@}"
          host="${host%%[:/?]*}"
          if [[ -z "$host" ]]; then
            echo "DATABASE_MIGRATION_URL has no parseable host; refusing to run migrations unmasked." >&2
            exit 1
          fi
          echo "::add-mask::$host"

      - name: Validate production migration history before apply
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: corepack pnpm run migration:validate-pre-migrate

      - name: Apply production database migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: corepack pnpm run migration:migrate

      - name: Validate production migration history after apply
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: corepack pnpm run migration:validate

      - name: Mark deployment attempt
        id: deploy-attempt
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        env:
          AGENT_OUTBOX_RELEASE_TAG:
            ${{ needs.prepare-release.outputs.release_tag }}
          APP_ENV: production
          APP_BASE_URL: https://app.agent-outbox.dev
          PUBLIC_APP_BASE_URL: https://app.agent-outbox.dev
          SENTRY_RELEASE: ${{ github.sha }}
          AGENT_OUTBOX_SENTRY_RELEASE_UPLOAD: "1"
          AGENT_OUTBOX_SENTRY_DEPLOY_RELEASE_PATH: "1"
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          SENTRY_BROWSER_DSN: ${{ vars.SENTRY_BROWSER_DSN }}
          # Non-secret Worker runtime config that is still an internal provider
          # resource id. Stored as an environment secret so Actions masks it in
          # public workflow logs; it is still passed to Wrangler as a --var.
          STRIPE_PAID_MONTHLY_PRICE_ID:
            ${{ secrets.STRIPE_PAID_MONTHLY_PRICE_ID }}
          STRIPE_PAID_YEARLY_PRICE_ID:
            ${{ secrets.STRIPE_PAID_YEARLY_PRICE_ID }}
          STRIPE_BILLING_PORTAL_CONFIGURATION_ID:
            ${{ secrets.STRIPE_BILLING_PORTAL_CONFIGURATION_ID }}
          NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN:
            ${{ vars.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_HYPERDRIVE_ID }}
          CLOUDFLARE_API_TOKEN:
            ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CALLER_KEY_HASH_SECRET: ${{ secrets.CALLER_KEY_HASH_SECRET }}
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: corepack pnpm run worker:deploy

      - name: Verify deployed release
        env:
          AGENT_OUTBOX_EXPECTED_RELEASE: ${{ github.sha }}
          AGENT_OUTBOX_REQUIRE_HUMAN_REVIEW_QUERY_CANARY: "1"
          AGENT_OUTBOX_RUNTIME_SMOKE_USE_PROCESS_ENV: "1"
          APP_BASE_URL: https://app.agent-outbox.dev
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
        run: corepack pnpm run smoke-runtime

      - name: Reverify draft assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          expected_assets="$(for artifact in dist/*.tar.gz dist/checksums.txt; do basename "$artifact"; done | LC_ALL=C sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "::error::Draft release asset inventory changed after deployment."
            exit 1
          fi
          for artifact in dist/*.tar.gz dist/checksums.txt; do
            asset="$(basename "$artifact")"
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$download_dir"
            if ! cmp -s "$artifact" "$download_dir/$asset"; then
              echo "::error::Draft release asset changed after deployment: $asset"
              exit 1
            fi
          done

      - name: Publish exact-candidate GitHub release
        id: publish-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node scripts/production-release.mjs publish

      # Automatic rollback runs inside this already-approved deploy job so it can
      # never be gated behind a second production-environment approval. It fires
      # for every failure after deployment begins until GitHub publication is
      # proven. Publication is the transaction commit point.
      - name: Roll back uncommitted release
        id: rollback-worker
        if: >-
          failure() && steps.deploy-attempt.outputs.attempted == 'true' &&
          steps.publish-release.outcome != 'success' &&
          steps.publish-release.outputs.publication_state != 'unknown'
        env:
          CLOUDFLARE_API_TOKEN:
            ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_API_TOKEN }}
          ROLLBACK_VERSION_ID:
            ${{ steps.rollback-target.outputs.rollback_version_id }}
        run: >-
          corepack pnpm exec wrangler rollback "$ROLLBACK_VERSION_ID" --name
          agent-outbox --message "Automatic rollback before publication of ${{
          needs.prepare-release.outputs.release_tag }}" --yes --env-file
          /dev/null

      - name: Verify restored release
        if: >-
          failure() && steps.deploy-attempt.outputs.attempted == 'true' &&
          steps.publish-release.outcome != 'success' &&
          steps.publish-release.outputs.publication_state != 'unknown'
        env:
          AGENT_OUTBOX_EXPECTED_RELEASE:
            ${{ steps.rollback-target.outputs.rollback_release }}
          AGENT_OUTBOX_RUNTIME_SMOKE_USE_PROCESS_ENV: "1"
          APP_BASE_URL: https://app.agent-outbox.dev
          SMOKE_OR_CLEANUP_TOKEN: ${{ secrets.SMOKE_OR_CLEANUP_TOKEN }}
        run: corepack pnpm run smoke-runtime

  publish-cli-homebrew:
    name: Verify public CLI and open Homebrew tap PR
    needs: [prepare-release, build-cli, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Checkout exact released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download certified CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-outbox-release-${{ github.sha }}
          path: dist

      - name: Require publicly downloadable release assets
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          for artifact in dist/*.tar.gz dist/checksums.txt; do
            asset="$(basename "$artifact")"
            url="https://github.com/conn-castle/agent-outbox/releases/download/${RELEASE_TAG}/${asset}"
            if ! curl -fsSL "$url" --output "$download_dir/$asset" || ! cmp -s "$artifact" "$download_dir/$asset"; then
              echo "::error::CLI release asset is not publicly downloadable: $url"
              echo "::error::Make conn-castle/agent-outbox public before publishing its Homebrew cask."
              exit 1
            fi
          done

      - name: Create GitHub App token for tap repo
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}
          owner: conn-castle
          repositories: homebrew-tap

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: conn-castle/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Update Homebrew cask
        run: |
          set -euo pipefail
          source_cask="dist/homebrew/Casks/agent-outbox.rb"
          target_cask="homebrew-tap/Casks/agent-outbox.rb"
          if [[ ! -f "$source_cask" ]]; then
            echo "::error::Certified release artifacts did not include $source_cask"
            exit 1
          fi
          mkdir -p "$(dirname "$target_cask")"
          cp "$source_cask" "$target_cask"
          git -C homebrew-tap status --porcelain
          git -C homebrew-tap diff -- Casks/agent-outbox.rb

      - name: Create PR in tap repo
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap
          branch: bump-agent-outbox-${{ env.RELEASE_TAG }}
          commit-message: "agent-outbox ${{ env.RELEASE_TAG }}"
          title: "agent-outbox ${{ env.RELEASE_TAG }}"
          body: "Automated cask bump for ${{ env.RELEASE_TAG }}."
          base: main

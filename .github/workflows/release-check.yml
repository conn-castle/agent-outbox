name: Release Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; give every non-PR run its own group.
# Use a literal prefix because called workflows inherit the caller's github context.
concurrency:
  # prettier-ignore
  group: release-check-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Run verification gate
        run: make check

  go-check:
    name: make go-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run Go CLI verification gate
        run: make go-check

  release-check:
    name: make release-check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [check, go-check]
    if: ${{ !cancelled() }}
    steps:
      - name: Require successful prerequisites
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON" >/dev/null; then
            echo "::error::make release-check requires successful make check and make go-check jobs in this run."
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS_JSON" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Set up dependencies
        run: make setup

      - name: Run release-only verification
        run: make package-check marketing-verify

  browser:
    name: make browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: make browser

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-check-browser-failures
          path: test-results/
          retention-days: 7

  migration-replay:
    name: make migration-replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agent_outbox_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_outbox_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AGENT_OUTBOX_ENABLE_DATABASE_TESTS: "1"
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_outbox_ci
      FLYWAY_DOCKER_NETWORK: host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Replay migrations from scratch
        run: make migration-replay

      - name: Run database verification suite
        run: make test-database

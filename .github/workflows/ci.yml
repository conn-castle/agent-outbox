name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer commit on a pull request cancels that PR's superseded CI run.
# Every other run (push to main, manual dispatch, production certification via
# workflow_call, where github.workflow is the caller's name) gets its own
# run-ID group, so it never cancels or replaces another run.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Run verification gate
        run: make check

  go-check:
    name: make go-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Run Go CLI verification gate
        run: make go-check

  browser:
    name: make browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: make browser

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-browser-failures
          path: test-results/
          retention-days: 7

  migration-replay:
    name: make migration-replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agent_outbox_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_outbox_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AGENT_OUTBOX_ENABLE_DATABASE_TESTS: "1"
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_outbox_ci
      FLYWAY_DOCKER_NETWORK: host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Replay migrations from scratch
        run: make migration-replay

      - name: Run database verification suite
        run: make test-database

  release-check:
    name: make release-check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Set up dependencies
        run: make setup

      # make release-check is check go-check package-check marketing-verify.
      # check and go-check run as sibling jobs; this context runs the remainder.
      - name: Run release-only gates
        run: make package-check marketing-verify

name: Detect Abandoned Production Release

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

# GitHub lists draft releases only to tokens with push access. The detector
# never mutates; it needs write scope solely to see drafts.
permissions:
  contents: write
  actions: read

jobs:
  detect:
    name: Report abandoned GitHub release drafts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up dependencies
        run: make setup

      - name: Detect abandoned release drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release.mjs detect-abandoned

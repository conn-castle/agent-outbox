# Everyday setup:
# - Use `al wizard` for most changes.
# - Usually you only need to toggle agent/server `enabled` values.
# - Leave advanced fields as-is unless you have a specific need.

[approvals]
mode = "yolo"

[agents.antigravity]
enabled = true
model = "Gemini 3.7 Flash (High)"

[agents.claude]
disable_question_tool = true
enabled = true
local_config_dir = true
model = "opus"
reasoning_effort = "high" # low | medium | high | xhigh | max (custom values pass through with a warning)
statusline = true

[agents.claude_vscode]
enabled = true

[agents.codex]
enabled = true
model = "gpt-5.6-sol"
local_config_dir = true
reasoning_effort = "medium" # codex only
statusline = true

[agents.codex.agent_specific]

[agents.codex.agent_specific.features]
plugins = false
apps = false
browser_use = false
computer_use = false
in_app_browser = false

[agents.vscode]
enabled = true

[agents.copilot_cli]
enabled = true
# model = "..."

[mcp]

[warnings]
instruction_token_threshold = 10000
mcp_schema_tokens_server_threshold = 20000
mcp_schema_tokens_total_threshold = 30000
mcp_server_threshold = 15
mcp_server_tools_threshold = 25
mcp_tools_total_threshold = 60
noise_mode = 'default'
version_update_on_sync = true

[dispatch]
# Maximum dispatch depth, including the initial `al dispatch` call.
# 1 means a dispatched target cannot call `al dispatch` again.
max_depth = 1

[notifications]
chime = true

[skills]
# Git-backed Agent Skill imports. Each [[skills.imports]] block declares one
# source repository plus the selectors that share its ref, tracking mode, write
# policy, and push destination. Manage these blocks with `al skills add` and
# `al skills remove`, then run `al skills pull` to fetch and reconcile them.
# Imported skills live in .agent-layer/skills-imported/<skill-name>/ and are
# editable; `al skills pull` merges upstream changes without discarding local
# edits. See https://agent-layer.dev/docs/skills#importing-skills-from-git
#
# [[skills.imports]]
# repository = "https://github.com/example/skills.git"
# selectors = ["skills/*", "!skills/internal-only"]
# ref = "main"               # branch, tag, or commit; omit for the default branch
# tracking = "tracked"       # tracked or pinned; branches track, tags and commits pin
# write_policy = "none"      # none | branch | direct
# push_repository = "..."    # optional fork destination for contributions
# push_branch = "..."        # required when write_policy = "branch"

[agents]

[agents.claude.agent_specific]
autoMemoryEnabled = false

[agents.claude.agent_specific.env]
CLAUDE_CODE_AUTO_CONNECT_IDE = "false"
ENABLE_CLAUDEAI_MCP_SERVERS = "false"

[[skills.imports]]
repository = 'https://github.com/emilkowalski/skills'
selectors = [
  'skills/apple-design',
]

[[skills.imports]]
repository = 'https://github.com/nicholasjconn/skills'
selectors = [
  'skills/tools/request-html-comments',
]
packages:
  - "."
virtualStoreType: global
# These declarations import React types without declaring their type peer.
packageExtensions:
  next:
    peerDependencies:
      "@types/react": "*"
  "@dnd-kit/core":
    peerDependencies:
      "@types/react": "*"
  "@dnd-kit/modifiers":
    peerDependencies:
      "@types/react": "*"
  "@dnd-kit/sortable":
    peerDependencies:
      "@types/react": "*"
  "@dnd-kit/utilities":
    peerDependencies:
      "@types/react": "*"
allowBuilds:
  "@sentry/cli": true
  core-js: false
  esbuild: true
  rclone.js: false
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - prettier@3.9.3
  - "@clerk/backend@3.8.5"
  - "@clerk/nextjs@7.5.10"
  - "@clerk/react@6.11.2"
  - "@clerk/shared@4.22.1"
  - lucide-react@1.23.0
  - "@posthog/types@1.413.0"
  - posthog-js@1.435.1
